# DeepBl4nder — Docker Compose
#
# Architecture locale : LLM + Blender + TUI
#
# Usage:
#   docker compose up -d                    # Core: LLM + Blender worker
#   docker compose --profile tui up -d      # Avec TUI
#   docker compose --profile ue5 up -d      # Avec UE5
#   docker compose --profile godot up -d    # Avec Godot
#   docker compose --profile ai-video up -d # Avec AI Video
#
# Services:
#   llm-server      — llama-cpp-python avec Qwen3 (GPU)
#   blender-worker  — Blender + FFmpeg headless (GPU)
#   tui             — Interface terminal Textual (optionnel)

x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  BLENDER_EXE: /usr/local/bin/blender
  FFMPEG_EXE: /usr/local/bin/ffmpeg

services:
  # ══════════════════════════════════════════════════════════
  #  LLM Server (llama-cpp-python + Qwen3)
  # ══════════════════════════════════════════════════════════

  llm-server:
    image: deepbl4nder-llm
    build:
      context: .
      dockerfile: Dockerfile.llm
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  #  Blender Worker (headless)
  # ══════════════════════════════════════════════════════════

  blender-worker:
    image: deepbl4nder-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - ./work:/work
      - ./projects:/projects
      - ./output:/output
    environment:
      <<: *common-env
      DeepBl4nder_WORKER: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    depends_on:
      llm-server:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  #  TUI (Textual Terminal UI) — Profile "tui"
  # ══════════════════════════════════════════════════════════

  tui:
    image: deepbl4nder-tui
    build:
      context: .
      dockerfile: Dockerfile.tui
    volumes:
      - ./work:/work
      - ./projects:/projects
      - ./output:/output
      - ./data:/app/data
    environment:
      <<: *common-env
      DeepBl4nder_API_URL: http://llm-server:8080
      DeepBl4nder_MODELS_DIR: /models
    depends_on:
      llm-server:
        condition: service_healthy
    profiles: ["tui"]
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  #  UE5 Server (optionnel, profile "ue5")
  # ══════════════════════════════════════════════════════════

  ue5-server:
    image: deepbl4nder-ue5-server
    build:
      context: ./ue5-server
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      UE5_EXE: /opt/UnrealEngine/Engine/Binaries/Linux/UnrealEditor-Cmd
      UE5_PROJECT: /ue5-projects/DeepBl4nder
      DeepBl4nder_API_URL: http://llm-server:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["ue5"]
    restart: unless-stopped
    depends_on:
      llm-server:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  #  Godot Server (optionnel, profile "godot")
  # ══════════════════════════════════════════════════════════

  godot-server:
    image: deepbl4nder-godot-server
    build:
      context: ./godot-server
      dockerfile: Dockerfile
    ports:
      - "8082:8081"
    environment:
      GODOT_EXE: /usr/local/bin/godot
      GODOT_PROJECT: /godot-projects/DeepBl4nder
      DeepBl4nder_API_URL: http://llm-server:8080
    volumes:
      - ./work:/work
    profiles: ["godot"]
    restart: unless-stopped
    depends_on:
      llm-server:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  #  AI Video Server (optionnel, profile "ai-video")
  # ══════════════════════════════════════════════════════════

  ai-video-server:
    image: deepbl4nder-ai-video-server
    build:
      context: ./ai-video-server
      dockerfile: Dockerfile
    ports:
      - "8083:8082"
    environment:
      GPU_ID: "0"
      CACHE_DIR: /cache/ai-video
      OUTPUT_DIR: /output/ai-video
      DeepBl4nder_API_URL: http://llm-server:8080
    volumes:
      - ai-video-cache:/cache/ai-video
      - ./work:/work
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["ai-video"]
    restart: unless-stopped
    depends_on:
      llm-server:
        condition: service_healthy

volumes:
  ai-video-cache: