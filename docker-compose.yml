# DeepBl4nder — Docker Compose
#
# Architecture locale : LLM + Blender + TUI
#
# Usage:
#   docker compose up -d                    # Core: LLM + Blender worker
#   docker compose --profile tui up -d      # Avec TUI
#
# Services:
#   llm-server      — llama-cpp-python avec Qwen3 (GPU)
#   blender-worker  — Blender + FFmpeg headless (GPU)
#   tui             — Interface terminal Textual (optionnel)

x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  BLENDER_EXE: /usr/local/bin/blender
  FFMPEG_EXE: /usr/local/bin/ffmpeg

services:
  # ══════════════════════════════════════════════════════════
  #  LLM Server (llama-cpp-python + Qwen3)
  # ══════════════════════════════════════════════════════════

  llm-server:
    image: deepbl4nder-llm
    build:
      context: .
      dockerfile: Dockerfile.llm
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 5
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════
  #  Blender Worker (headless)
  # ══════════════════════════════════════════════════════════

  blender-worker:
    image: deepbl4nder-worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    volumes:
      - ./work:/work
      - ./projects:/projects
      - ./output:/output
    environment:
      <<: *common-env
      DeepBl4nder_WORKER: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility, graphics]
    restart: unless-stopped
    depends_on:
      llm-server:
        condition: service_healthy

  # ══════════════════════════════════════════════════════════
  #  TUI (Textual Terminal UI) — Profile "tui"
  # ══════════════════════════════════════════════════════════

  tui:
    image: deepbl4nder-tui
    build:
      context: .
      dockerfile: Dockerfile.tui
    volumes:
      - ./work:/work
      - ./projects:/projects
      - ./output:/output
      - ./data:/app/data
    environment:
      <<: *common-env
      DeepBl4nder_API_URL: http://llm-server:8080
      DeepBl4nder_MODELS_DIR: /models
    depends_on:
      llm-server:
        condition: service_healthy
    profiles: ["tui"]
    stdin_open: true
    tty: true
    restart: unless-stopped