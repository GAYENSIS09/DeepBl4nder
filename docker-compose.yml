services:
  deepblender-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: deepblender/worker:latest
    command: ["blender", "-b", "-P", "/work/script.py"]
    volumes:
      - ./work:/work
      - ./projects:/projects
    environment:
      - BLENDER_EXE=/usr/local/bin/blender
      - PYTHONPATH=/app:/work
      - DEEPBLENDER_WORKER=1
    # GPU support (requires nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  # Optional: render farm coordinator (scheduler)
  deepblender-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: deepblender/scheduler:latest
    command: python -m deepblender.blender.scheduler
    volumes:
      - ./work:/work
    environment:
      - PYTHONPATH=/app:/work
    depends_on:
      - deepblender-worker
    restart: unless-stopped

  # Optional: gateway API
  deepblender-api:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: deepblender/api:latest
    command: python -m deepblender.api.app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./work:/work
    environment:
      - PYTHONPATH=/app:/work
    restart: unless-stopped