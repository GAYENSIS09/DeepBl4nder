name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check deepblender tests
      - name: Mypy
        run: python -m mypy deepblender
      - name: Pytest
        run: python -m pytest -q
      - name: Découplage NOOA ↔ legacy (palier 3)
        run: python -m pytest tests/test_decoupling.py -q
