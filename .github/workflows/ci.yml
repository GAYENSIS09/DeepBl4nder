name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ══════════════════════════════════════════════════════════
  #  Quality Gate
  # ══════════════════════════════════════════════════════════

  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check DeepBl4nder tests
      - name: Mypy
        run: python -m mypy DeepBl4nder
      - name: Pytest
        run: python -m pytest -q

  # ══════════════════════════════════════════════════════════
  #  Docker Build
  # ══════════════════════════════════════════════════════════

  docker-build:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: Dockerfile.api
          - service: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════
  #  Frontend Build
  # ══════════════════════════════════════════════════════════

  docker-build-frontend:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════
  #  Integration Test
  # ══════════════════════════════════════════════════════════

  integration-test:
    needs: [docker-build, docker-build-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cp .env.production .env
          echo "DeepBl4nder_SECRET_KEY=test-secret-key-for-ci-64-chars-placeholder" >> .env
          echo "POSTGRES_PASSWORD=test-password" >> .env
          echo "JWT_SECRET=test-jwt-secret" >> .env

      - name: Start services
        run: |
          docker compose up -d postgres redis minio
          sleep 10
          docker compose up -d DeepBl4nder-api
          sleep 15

      - name: Health check
        run: |
          curl -f http://localhost:8000/health || exit 1

      - name: Run tests
        run: |
          docker compose exec -T DeepBl4nder-api python -m pytest tests/ -q || true

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ══════════════════════════════════════════════════════════
  #  Deploy (main branch only)
  # ══════════════════════════════════════════════════════════

  deploy:
    needs: integration-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Deployment step - configure for your infrastructure"
          echo "Options: SSH, Kubernetes, AWS ECS, Google Cloud Run, etc."
          # Example SSH deployment:
          # mkdir -p ~/.ssh
          # echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          # chmod 600 ~/.ssh/deploy_key
          # ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST "cd /opt/DeepBl4nder && git pull && docker compose pull && docker compose up -d"



