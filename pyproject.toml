[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepblender"
version = "0.2.0"
description = "DeepBlender : orchestration d'agents IA (NOOA) avec capacites, scheduler, bus d'evenements, evaluation de scenes et rendu Blender."
requires-python = ">=3.12"
dependencies = [
    "nooa==0.0.8",
    "python-dotenv>=1.0",
    "fastapi>=0.141",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "PyJWT>=2.10",
    "alembic>=1.13",
]

[project.optional-dependencies]
memory = ["nooa-memory==0.0.8"]
sandbox = ["nooa[sandbox]==0.0.8"]
tracing = ["nooa[tracing]==0.0.8"]
mcp = ["nooa[mcp]==0.0.8"]
vllm = ["vllm>=0.8"]
worker = ["psutil"]
dev = ["ruff", "mypy", "pytest", "httpx>=0.27"]

[project.scripts]
deepblender = "deepblender.cli:main"

[tool.setuptools.packages.find]
include = ["deepblender*"]

[tool.setuptools.package-data]
"deepblender" = ["skills/*/SKILL.md"]

[tool.mypy]
python_version = "3.12"
files = ["deepblender", "tests"]
check_untyped_defs = true

[tool.ruff]
exclude = ["data", "frontend/.next"]

[tool.ruff.lint]
ignore = ["E402"]

[[tool.mypy.overrides]]
module = "deepblender.bridge.worker"
disable_error_code = ["import-not-found"]

[[tool.mypy.overrides]]
module = ["nooa", "nooa.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["deepblender.agents.*"]
disable_error_code = ["empty-body", "import-untyped"]
