[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepBl4nder"
version = "0.2.0"
description = "AI agent orchestration (NOOA) with capabilities, scheduler, event bus, scene evaluation, and Blender rendering."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "GAYENSIS09" },
]
keywords = ["blender", "ai", "agents", "nooa", "3d", "animation", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "nooa==0.0.8",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.20",
    "httpx>=0.27",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/GAYENSIS09/DeepBl4nder"
Repository = "https://github.com/GAYENSIS09/DeepBl4nder"
Issues = "https://github.com/GAYENSIS09/DeepBl4nder/issues"
Documentation = "https://github.com/GAYENSIS09/DeepBl4nder/tree/main/docs"

[project.optional-dependencies]
local-llm = ["llama-cpp-python>=0.3"]
memory = ["nooa-memory==0.0.8"]
sandbox = ["nooa[sandbox]==0.0.8"]
tracing = ["nooa[tracing]==0.0.8"]
mcp = ["nooa[mcp]==0.0.8"]
tui = ["textual>=0.52", "rich>=13.0"]
pynvml = ["pynvml>=11.5"]
worker = ["psutil"]
dev = ["ruff", "mypy", "pytest", "httpx>=0.27"]

[project.scripts]
DeepBl4nder = "DeepBl4nder.cli:main"

[tool.setuptools.packages.find]
include = ["DeepBl4nder*"]

[tool.setuptools.package-data]
"DeepBl4nder" = ["skills/*/SKILL.md"]

[tool.mypy]
python_version = "3.12"
files = ["DeepBl4nder", "tests"]
check_untyped_defs = true

[tool.ruff]
exclude = ["data", "frontend/.next"]

[tool.ruff.lint]
ignore = ["E402", "N999"]

[[tool.mypy.overrides]]
module = "DeepBl4nder.bridge.worker"

[[tool.mypy.overrides]]
module = ["nooa", "nooa.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["DeepBl4nder.agents.*"]
disable_error_code = ["empty-body", "import-untyped"]

[[tool.mypy.overrides]]
module = ["DeepBl4nder.tui.*"]
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["arg-type", "call-overload", "return-value", "attr-defined", "union-attr"]
