<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <defs>
    <linearGradient id="acid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AAFF00"/>
      <stop offset="100%" stop-color="#88CC00"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AAFF00" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#AAFF00" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#AAFF00" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#AAFF00" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <rect x="0" y="0" width="800" height="200" rx="16" fill="#0A0A0A"/>
  <rect x="0" y="0" width="800" height="200" rx="16" fill="url(#glow)"/>

  <!-- Icon: Blender-like 3D cube with neural network nodes -->
  <g transform="translate(30, 30)" filter="url(#shadow)">
    <!-- 3D Cube wireframe -->
    <path d="M70 20 L120 50 L120 100 L70 130 L20 100 L20 50 Z" stroke="url(#acid-grad)" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <path d="M70 20 L70 130" stroke="#AAFF00" stroke-width="1.5" opacity="0.4"/>
    <path d="M20 50 L120 50" stroke="#AAFF00" stroke-width="1.5" opacity="0.4"/>
    <path d="M20 100 L70 130" stroke="#AAFF00" stroke-width="1.5" opacity="0.3"/>
    <path d="M120 50 L70 20" stroke="#AAFF00" stroke-width="1.5" opacity="0.3"/>

    <!-- Neural network nodes -->
    <circle cx="70" cy="20" r="4" fill="#AAFF00"/>
    <circle cx="20" cy="50" r="3.5" fill="#AAFF00" opacity="0.9"/>
    <circle cx="120" cy="50" r="3.5" fill="#AAFF00" opacity="0.9"/>
    <circle cx="70" cy="130" r="4" fill="#AAFF00"/>
    <circle cx="45" cy="75" r="2.5" fill="#88CC00" opacity="0.7"/>
    <circle cx="95" cy="75" r="2.5" fill="#88CC00" opacity="0.7"/>
    <circle cx="70" cy="75" r="3" fill="#AAFF00" opacity="0.85"/>

    <!-- Neural connections -->
    <line x1="70" y1="20" x2="45" y2="75" stroke="#AAFF00" stroke-width="0.8" opacity="0.5"/>
    <line x1="70" y1="20" x2="95" y2="75" stroke="#AAFF00" stroke-width="0.8" opacity="0.5"/>
    <line x1="20" y1="50" x2="45" y2="75" stroke="#AAFF00" stroke-width="0.8" opacity="0.5"/>
    <line x1="120" y1="50" x2="95" y2="75" stroke="#AAFF00" stroke-width="0.8" opacity="0.5"/>
    <line x1="45" y1="75" x2="70" y2="130" stroke="#AAFF00" stroke-width="0.8" opacity="0.4"/>
    <line x1="95" y1="75" x2="70" y2="130" stroke="#AAFF00" stroke-width="0.8" opacity="0.4"/>
    <line x1="45" y1="75" x2="95" y2="75" stroke="#88CC00" stroke-width="0.6" opacity="0.4"/>
  </g>

  <!-- Text: Deep -->
  <text x="175" y="105" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="-2">
    Deep
  </text>

  <!-- Text: Bl4nder (accent color) -->
  <text x="370" y="105" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#acid-grad)" letter-spacing="-2" filter="url(#shadow)">
    Bl4nder
  </text>

  <!-- Tagline -->
  <text x="175" y="140" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#888880" letter-spacing="1.5">
    AI-POWERED AUDIOVISUAL PRODUCTION
  </text>

  <!-- Version badge -->
  <g transform="translate(680, 125)">
    <rect x="0" y="0" width="48" height="22" rx="11" fill="#111111" stroke="#222222" stroke-width="1"/>
    <text x="24" y="15" font-family="'JetBrains Mono', monospace" font-size="10" fill="#888880" text-anchor="middle">
      v0.2
    </text>
  </g>
</svg>
